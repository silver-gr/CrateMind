name: Tests and contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'native/src-tauri/Cargo.*'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'native/src-tauri/Cargo.*'
      - '.github/workflows/checks.yml'
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    # macOS matches the machine the suite is developed on.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Media tools the waveform and loudness tests decode with
        run: brew install ffmpeg chromaprint
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --locked --python 3.13.18
          uv run pytest
      - name: Schema contract and route parity
        working-directory: backend
        run: |
          uv run python ../scripts/desktop/generate_schema_contract.py --check
          uv run python ../scripts/desktop/check_parity_inventory.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Frontend tests and type check
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
  licences:
    # macOS, like the desktop bundle: its wheels, and Homebrew's ffmpeg as desktop.yml stages it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
      - name: What the bundle is made from
        run: |
          brew install ffmpeg chromaprint
          (cd backend && UV_PROJECT_ENVIRONMENT=.venv-desktop uv sync --locked --python 3.13.18 --no-default-groups --group desktop)
          (cd frontend && bun install --frozen-lockfile)
          cargo fetch --locked --manifest-path native/src-tauri/Cargo.toml
      - name: Licence gate
        shell: bash
        run: python3 scripts/third_party_licenses.py --check | tee -a "$GITHUB_STEP_SUMMARY"
