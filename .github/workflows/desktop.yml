name: Desktop core validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'native/**'
      - 'scripts/desktop/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Rust changes
        id: rust_changes
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_REV" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$BASE_REV" HEAD -- native/ .github/workflows/desktop.yml)
            if [ -n "$changed" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: clippy
      - name: Isolated Python core environment
        run: |
          cd backend
          UV_PROJECT_ENVIRONMENT=.venv-desktop uv sync --locked --python 3.13.18 --no-default-groups --group desktop
      - name: Desktop frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun test tests
          bun run build:desktop
      - name: Rust Clippy
        if: steps.rust_changes.outputs.run == 'true'
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --locked --manifest-path native/src-tauri/Cargo.toml --all-targets
      - name: Rust host tests
        run: cargo test --locked --manifest-path native/src-tauri/Cargo.toml
      - name: Packaged Python self-test
        run: python3 scripts/desktop/build_backend.py --self-test
      - name: Stage native media tools
        run: |
          brew install ffmpeg chromaprint
          python3 scripts/desktop/stage_resources.py --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)" --fpcalc "$(command -v fpcalc)"
      - name: Verify packaged resources and HTTP lifecycle
        run: |
          python3 scripts/desktop/verify_bundle.py --artifact native/src-tauri/resources
          python3 scripts/desktop/smoke_installed.py --artifact native/src-tauri/resources
      - name: Unsigned preview app
        working-directory: native
        run: |
          bun install --frozen-lockfile
          bun run build:preview
      - uses: actions/upload-artifact@v4
        with:
          name: CrateMind-preview-macos-arm64-unsigned
          path: native/src-tauri/target/release/bundle/macos/*.app
# This prepares one native validation route. It does not claim CI execution,
# release signing/notarization, Windows/Linux installers or native WebView QA.
