name: Windows x64 unsigned build
on:
  workflow_dispatch:
  push:
    branches: [windows-build]
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-01-12-49/ffmpeg-n8.1.3-29-gad3b795b72-win64-lgpl-8.1.zip
      FPCALC_URL: https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tag matches version files and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/version.py check "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - name: Isolated Python core environment
        shell: bash
        run: |
          cd backend
          UV_PROJECT_ENVIRONMENT=.venv-desktop uv sync --locked --python 3.13.18 --no-default-groups --group desktop
      - name: Desktop frontend
        shell: bash
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build:desktop
      - name: Packaged Python self-test
        shell: bash
        run: python scripts/desktop/build_backend.py --self-test
      - name: Download media tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/win-tools/ffmpeg, build/win-tools/fpcalc, build/win-tools/licenses | Out-Null
          Invoke-WebRequest $env:FFMPEG_URL -OutFile build/win-tools/ffmpeg.zip
          Invoke-WebRequest $env:FPCALC_URL -OutFile build/win-tools/fpcalc.zip
          Expand-Archive build/win-tools/ffmpeg.zip -DestinationPath build/win-tools/ffmpeg
          Expand-Archive build/win-tools/fpcalc.zip -DestinationPath build/win-tools/fpcalc
          foreach ($pair in @(@('ffmpeg', 'ffmpeg.exe'), @('ffmpeg', 'ffprobe.exe'), @('fpcalc', 'fpcalc.exe'))) {
            if (-not (Get-ChildItem build/win-tools/$($pair[0]) -Recurse -Filter $pair[1])) { throw "Missing $($pair[1]) in archive" }
          }
          # Upstream licence texts, when the archives provide them.
          $f = Get-ChildItem build/win-tools/ffmpeg -Recurse -Filter 'LICENSE*' -File | Select-Object -First 1
          if ($f) { Copy-Item $f.FullName build/win-tools/licenses/ffmpeg-LICENSE.txt }
          $c = Get-ChildItem build/win-tools/fpcalc -Recurse -Include 'LICENSE*', 'COPYING*' -File | Select-Object -First 1
          if ($c) { Copy-Item $c.FullName build/win-tools/licenses/chromaprint-LICENSE.txt }
      - name: Stage native media tools
        shell: bash
        run: |
          find_tool() { find "build/win-tools/$1" -name "$2" -type f | head -n 1; }
          args=()
          for f in build/win-tools/licenses/*; do [ -f "$f" ] && args+=(--license-file "$f"); done
          python scripts/desktop/stage_resources.py --ffmpeg "$(find_tool ffmpeg ffmpeg.exe)" --ffprobe "$(find_tool ffmpeg ffprobe.exe)" --fpcalc "$(find_tool fpcalc fpcalc.exe)" "${args[@]}"
      - name: Verify packaged resources and HTTP lifecycle
        shell: bash
        run: |
          python scripts/desktop/verify_bundle.py --artifact native/src-tauri/resources
          python scripts/desktop/smoke_installed.py --artifact native/src-tauri/resources
      - name: Unsigned preview installer
        shell: bash
        working-directory: native
        run: |
          bun install --frozen-lockfile
          python ../scripts/desktop/build_native.py --preview
      - uses: actions/upload-artifact@v4
        with:
          name: cratemind-windows-x64
          path: native/src-tauri/target/release/bundle/nsis/*.exe
  release:
    needs: windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cratemind-windows-x64
          path: dist
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/version.py notes "${GITHUB_REF_NAME#v}" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.exe --title "CrateMind ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
          fi
