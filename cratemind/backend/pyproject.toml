[project]
name = "cratemind-backend"
version = "0.1.0"
description = "CrateMind — local-first DJ intelligence layer (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "sqlmodel>=0.0.39",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "mutagen>=1.48.1",
    "python-multipart>=0.0.32",
    "librosa>=0.11",
    "numpy>=2.4",
    "scipy>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.5.0",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
