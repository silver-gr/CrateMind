<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>CrateMind</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #090b17;
        --surface: #11172a;
        --surface-top: #182039;
        --border: #9dbbdd26;
        --text: #eef1fa;
        --muted: #a5aec5;
        --faint: #78849f;
        --cyan: #00d5e8;
        --violet: #af83f7;
        --lime: #b9e54c;
        --shadow: #00000066;
        --ease-out: cubic-bezier(.23, 1, .32, 1);
        background: transparent;
        color: var(--text);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --background: #f4f3f0;
        --surface: #ffffff;
        --surface-top: #ffffff;
        --border: #34497826;
        --text: #202940;
        --muted: #596782;
        --faint: #68738a;
        --cyan: #087e96;
        --violet: #7951c7;
        --lime: #809e26;
        --shadow: #2839561a;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        /* Margin only for the card shadow: the splash window is transparent. */
        padding: 24px 20px 40px;
        display: grid;
        place-items: center;
        overflow: hidden;
        overflow-wrap: anywhere;
        background: transparent;
      }
      .startup-panel {
        position: relative;
        isolation: isolate;
        width: 100%;
        padding: 40px 36px 32px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: linear-gradient(145deg, var(--surface-top), var(--surface));
        box-shadow: 0 1px 0 #ffffff0a inset, 0 24px 80px -32px var(--shadow);
        text-align: center;
        animation: reveal 280ms var(--ease-out) both;
      }
      .startup-panel::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 25%;
        right: 25%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
        opacity: .65;
      }
      .identity {
        position: relative;
        width: 138px;
        height: 138px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
      }
      .identity::before {
        content: "";
        position: absolute;
        inset: 4px;
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .identity::after {
        content: "";
        position: absolute;
        inset: -7px;
        border: 1px dashed color-mix(in srgb, var(--cyan) 18%, transparent);
        border-radius: 50%;
        transform: rotate(-18deg) scaleY(.83);
      }
      .glyph { display: block; width: 118px; height: 118px; object-fit: contain; }
      .wordmark { margin: 0; font-size: 30px; font-weight: 720; letter-spacing: -.055em; line-height: 1.2; }
      .tagline { margin: 7px 0 30px; color: var(--faint); font-size: 10px; font-weight: 600; letter-spacing: .22em; }
      h1 { margin: 0; font-size: 20px; font-weight: 580; letter-spacing: -.025em; line-height: 1.5; }
      #startup-message { margin: 8px 0 0; max-height: 7em; overflow: auto; color: var(--muted); font-size: 13px; }
      .activity { margin: 26px auto 22px; width: 204px; }
      .equalizer { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 20px; margin-bottom: 13px; }
      .equalizer span {
        width: 3px;
        height: 18px;
        border-radius: 3px;
        background: var(--cyan);
        transform-origin: center bottom;
        animation: breathe 1.2s ease-in-out infinite alternate;
      }
      .equalizer span:nth-child(2) { background: var(--lime); animation-delay: -.4s; }
      .equalizer span:nth-child(3) { background: var(--violet); animation-delay: -.8s; }
      .equalizer span:nth-child(4) { animation-delay: -.2s; }
      .progress { height: 3px; overflow: hidden; border-radius: 3px; background: var(--border); }
      .progress::after {
        content: "";
        display: block;
        width: 34%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--lime), var(--violet));
        animation: loading 2.4s linear infinite;
      }
      .detail { margin: 0; color: var(--faint); font-size: 11px; line-height: 1.7; }
      #startup-retry { margin-top: 18px; color: var(--muted); }
      [data-state="error"] .activity { display: none; }
      [data-state="error"] #startup-message { margin-top: 16px; }
      @keyframes loading { from { transform: translateX(-105%); } to { transform: translateX(300%); } }
      @keyframes breathe { from { transform: scaleY(.35); opacity: .5; } to { transform: scaleY(1); opacity: 1; } }
      @keyframes reveal { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .startup-panel, .equalizer span, .progress::after { animation: none; }
        .equalizer span:nth-child(even) { transform: scaleY(.6); }
        .progress::after { width: 100%; opacity: .65; }
      }
    </style>
  </head>
  <body>
    <main class="startup-panel" data-tauri-drag-region="deep" aria-labelledby="startup-title">
      <div class="identity"><img class="glyph" src="glyph.png" alt="" width="118" height="118"></div>
      <p class="wordmark">CrateMind</p>
      <p class="tagline">DJ INTELLIGENCE</p>
      <h1 id="startup-title">Η βιβλιοθήκη σου ετοιμάζεται</h1>
      <p id="startup-message" data-tauri-drag-region="false" role="status" aria-live="polite">Ανοίγουμε τον χώρο για τη μουσική σου…</p>
      <div class="activity" aria-hidden="true">
        <div class="equalizer"><span></span><span></span><span></span><span></span></div>
        <div class="progress"></div>
      </div>
      <p id="startup-detail" class="detail">Το CrateMind θα ανοίξει αυτόματα μόλις είναι έτοιμο.</p>
      <p id="startup-retry" class="detail" hidden>Επίλεξε «Επανάληψη εκκίνησης» από το μενού CrateMind για να δοκιμάσεις ξανά.</p>
    </main>
  </body>
</html>
