<!doctype html>
<!-- Source for splash.png, the Velopack installer splash. Regenerate:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=520,340 --screenshot=splash.png splash.html -->
<html lang="el">
  <head>
    <meta charset="utf-8">
    <style>
      :root { --border: #9dbbdd26; --text: #eef1fa; --muted: #a5aec5; --faint: #78849f; --cyan: #00d5e8; --violet: #af83f7; --lime: #b9e54c; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 520px; height: 340px; overflow: hidden; }
      body {
        position: relative;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #182039 0%, #11172a 55%, #090b17 100%);
        color: var(--text);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      body::before {
        content: "";
        position: absolute;
        top: 0; left: 25%; right: 25%; height: 1px;
        background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
        opacity: .65;
      }
      .identity { position: relative; width: 112px; height: 112px; margin: 0 auto 12px; display: grid; place-items: center; }
      .identity::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--border); border-radius: 50%; }
      .identity::after {
        content: ""; position: absolute; inset: -6px; border-radius: 50%;
        border: 1px dashed color-mix(in srgb, var(--cyan) 18%, transparent);
        transform: rotate(-18deg) scaleY(.83);
      }
      .glyph { width: 94px; height: 94px; object-fit: contain; }
      .wordmark { margin: 0; font-size: 28px; font-weight: 720; letter-spacing: -.055em; line-height: 1.2; }
      .tagline { margin: 6px 0 22px; color: var(--faint); font-size: 10px; font-weight: 600; letter-spacing: .22em; }
      .status { margin: 0; color: var(--muted); font-size: 13px; }
      .bars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 18px; margin-top: 14px; }
      .bars span { width: 3px; border-radius: 3px; background: var(--cyan); }
      .bars span:nth-child(1) { height: 9px; }
      .bars span:nth-child(2) { height: 18px; background: var(--lime); }
      .bars span:nth-child(3) { height: 12px; background: var(--violet); }
      .bars span:nth-child(4) { height: 15px; }
    </style>
  </head>
  <body>
    <main>
      <div class="identity"><img class="glyph" src="../startup/glyph.png" alt=""></div>
      <p class="wordmark">CrateMind</p>
      <p class="tagline">DJ INTELLIGENCE</p>
      <p class="status">Εγκατάσταση…</p>
      <div class="bars"><span></span><span></span><span></span><span></span></div>
    </main>
  </body>
</html>
