[project]
name = "cratemind-backend"
version = "0.7.0"
description = "CrateMind — local-first DJ intelligence layer (backend)"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "sqlmodel>=0.0.39",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "mutagen>=1.48.1",
    "python-multipart>=0.0.32",
    "numpy>=2.4",
]

[dependency-groups]
analysis = [
    "essentia>=2.1b6.dev1438; python_version == '3.14' and implementation_name == 'cpython'",
    "librosa>=0.11",
    "scipy>=1.18",
]
desktop = [
    "librosa>=0.11",
    "pyinstaller==6.22.3",
    "scipy>=1.18",
]
dev = [
    "pytest>=9.1",
    "httpx2>=2.5.0",
    "ruff>=0.15",
]

[tool.uv]
default-groups = ["dev", "analysis"]
# Release-age cooldown: never resolve a version uploaded in the last 7 days (as cargo's).
exclude-newer = "7 days"
# Owner's exception (2026-11-27): these five were uploaded on 2026-11-20/21, inside the window, and are
# taken anyway. The table can go once they are older than 7 days (from 2026-11-29).
exclude-newer-package = { certifi = "2026-11-28T00:00:00Z", pyyaml = "2026-11-28T00:00:00Z", decorator = "2026-11-28T00:00:00Z", charset-normalizer = "2026-11-28T00:00:00Z", packaging = "2026-11-28T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schema_contract.json"]
"app.desktop_runtime" = ["deno_schema_contract.json"]
